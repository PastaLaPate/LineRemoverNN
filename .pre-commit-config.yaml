repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run ruff format
        types: [python]
      - id: ruff-check
        name: ruff check
        language: system
        entry: uv run ruff check
        types: [python]
      - id: ty-check
        name: ty check
        language: system
        entry: uv run ty check
        pass_filenames: false