[workspace]
name = "lineremovernn"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
cairo = "*"
cmake = "*"
compilers = "*"
expat = "*"
opencv = ">=4.0.0,<5.0.0"
pkg-config = "*"
zlib = "*"

[pypi-dependencies]
lineremovernn = { path = ".", editable = true }

[tasks]
build = "uv pip install --no-deps -e ."
lineremovernn = { cmd = "lineremovernn", depends-on = ["build"] }
dev = { cmd = "lineremovernn", depends-on = ["build"] }
hooks = "uv run pre-commit install"
link-compile-commands = "sh -c 'ln -sf $(ls -d build/* | head -n1)/compile_commands.json compile_commands.json'"
clangd-setup = { cmd = "pixi run link-compile-commands", depends-on = ["build"] }