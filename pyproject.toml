[project]
name = "lineremovernn"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "colorama>=0.4.6",
  "distro>=1.9.0",
  "matplotlib>=3.10.8",
  "opencv-python<5.0",
  "pillow>=12.1.1",
  "pycairo>=1.29.0",
  "torch>=2.9.0",
  "torchinfo>=1.8.0",
  "torchvision==0.24.0",
  "tqdm>=4.67.3",
  "ty>=0.0.44",
]

[project.scripts]
lineremovernn = "lineremovernn.__main__:main"

[dependency-groups]
dev = [
  "cmake>=4.3.2",
  "nanobind>=2.0",
  "pre-commit>=4.6.0",
  "ruff>=0.15.16",
  "scikit-build-core>=0.12.2",
]

[build-system]
requires = ["nanobind>=2.0", "numpy", "scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
build-dir = "build"
cmake.build-type = "Debug"
wheel.packages = ["lineremovernn"]

[tool.scikit-build.cmake.define]
SKBUILD = "ON"
CMAKE_EXPORT_COMPILE_COMMANDS = "ON"

[tool.uv]
default-groups = []

[tool.uv.extra-build-dependencies]
lineremovernn = ["scikit-build-core"]

[tool.uv.workspace]
members = ["."]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
